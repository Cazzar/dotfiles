#[bootstrap.mise_shell_activate]
#zsh = true

[bootstrap.packages]
"brew:neovim" = "latest"
"brew:zplug" = "latest"
"brew:zoxide" = "latest"
"brew:tree-sitter" = "latest"
"brew:ripgrep" = "latest"
"brew:fd" = "latest"

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.repos]
"~/.dotfiles/nvim" = { url = "git@github.com:Cazzar/nvim.git" }

[dotfiles]
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "symlink" }
"~/.p10k.zsh" = { mode = "track" }
"~/.ssh/config" = { source = "ssh/config", mode = "copy" }
"~/.zshrc" = { mode = "symlink" }

[tools]
dotnet = "latest"
ffmpeg = "latest"
go = "latest"
node = "lts"
npm = "latest"
rust = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

